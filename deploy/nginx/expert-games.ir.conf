# Install as /etc/nginx/sites-available/expert-games.ir and enable it.
# The Node process listens only on localhost:3001; Nginx terminates HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name expert-games.ir www.expert-games.ir;

    # Keep this block until Certbot has issued the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expert-games.ir www.expert-games.ir;

    ssl_certificate /etc/letsencrypt/live/expert-games.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expert-games.ir/privkey.pem;

    root /var/www/expert-games/dist;
    index index.html;

    # Socket.IO requires HTTP/1.1 and connection upgrade headers.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # REST/auth endpoints are served by the same Node process.
    location ~ ^/(auth|users|social|groups|health)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router routes must fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
